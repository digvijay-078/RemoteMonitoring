[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer', 'nodejs_20', 'python3', 'python3Packages.pip', 'python3Packages.pillow']

[phases.build]
cmds = [
    'composer install --no-dev --optimize-autoloader',
    'npm install',
    'npm run build',
    'mkdir -p database storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs',
    'touch database/database.sqlite',
    'chmod -R 777 storage database'
]

[start]
cmd = 'bash start.sh'
